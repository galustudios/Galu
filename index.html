<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALU | Wearable Art</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>

  <!-- FIX: cursor definido en HTML con id para que el JS lo encuentre -->
  <div class="cursor-star" id="cursor"></div>

  <header>
    <div class="logo">GALU</div>
    <nav>
      <a href="#">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>GALU</h1>
      <h2>Wearable Art</h2>
      <p>Art you can wear.</p>
      <button class="explore-btn">Explore</button>
    </div>
  </section>

  <!-- FIX: id="gallery" para que el botón Explore y el nav funcionen -->
  <section class="gallery" id="gallery">
    <h2>Gallery</h2>
    <div class="grid">
      <!-- FIX: cards con label para no estar vacías -->
      <div class="card"><span class="card-label">No. 01</span></div>
      <div class="card tall"><span class="card-label">No. 02</span></div>
      <div class="card"><span class="card-label">No. 03</span></div>
      <div class="card wide"><span class="card-label">No. 04</span></div>
      <div class="card"><span class="card-label">No. 05</span></div>
      <div class="card tall"><span class="card-label">No. 06</span></div>
      <div class="card"><span class="card-label">No. 07</span></div>
      <div class="card"><span class="card-label">No. 08</span></div>
    </div>
  </section>

  <!-- FIX: id="about" para navegación -->
  <section class="about" id="about">
    <h2>About</h2>
    <p>
      GALU is a wearable art project where illustrations become objects that people can carry with them every day.
    </p>
  </section>

  <footer>
    © 2026 GALU
  </footer>

  <script src="script.js"></script>

</body>
</html>
